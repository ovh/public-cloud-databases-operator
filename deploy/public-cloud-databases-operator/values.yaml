# -- Override chart name
nameOverride: ""

# -- Override full release name
fullnameOverride: ""

# -- Number of operator pod replicas
replicas: 1

# -- Operator container image
image:
  repository: ovhcom/public-cloud-databases-operator
  # -- Defaults to Chart.AppVersion if not set
  tag: ""
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- OVHcloud API credentials
ovhCredentials:
  # -- Use an existing Secret instead of creating one.
  # When set, the chart will not create a Secret and will use this name instead.
  existingSecret: ""
  # -- Name for the auto-created Secret (defaults to release fullname)
  name: ""
  # -- OVHcloud API region (e.g. ovh-eu, ovh-ca, ovh-us)
  region: ""
  # -- OVHcloud API application key
  applicationKey: ""
  # -- OVHcloud API application secret
  applicationSecret: ""
  # -- OVHcloud API consumer key
  consumerKey: ""

# -- kube-rbac-proxy sidecar configuration.
# Provides RBAC-based authentication for the metrics endpoint.
kubeRbacProxy:
  image:
    repository: gcr.io/kubebuilder/kube-rbac-proxy
    tag: v0.13.1
    pullPolicy: IfNotPresent
  # -- Arguments passed to the kube-rbac-proxy container
  args:
    - --secure-listen-address=0.0.0.0:8443
    - --upstream=http://127.0.0.1:8080/
    - --logtostderr=true
    - --v=0
  # -- Resource limits and requests for the kube-rbac-proxy container
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 64Mi
  # -- Security context for the kube-rbac-proxy container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# -- Pod-level security context (applies to all containers)
podSecurityContext:
  runAsNonRoot: true

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64
                - ppc64le
                - s390x
            - key: kubernetes.io/os
              operator: In
              values:
                - linux

# -- Custom Resource Definitions
crd:
  # -- Install CRDs with the chart
  enable: true
  # -- Keep CRDs when uninstalling the chart
  keep: true

# -- Controller metrics endpoint.
# Exposes /metrics endpoint with RBAC protection via kube-rbac-proxy.
metrics:
  # -- Enable the metrics Service
  enable: true
  # -- Metrics server port
  port: 8443

# -- cert-manager integration for TLS certificates.
# Required for secure webhook and metrics endpoint certificates.
certManager:
  # -- Enable cert-manager TLS configuration
  enable: false

# -- Prometheus ServiceMonitor for metrics scraping.
# Requires prometheus-operator to be installed in the cluster.
prometheus:
  # -- Enable ServiceMonitor creation
  enable: false

