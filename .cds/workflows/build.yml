name: Build
on: [push]

integrations: [artifactory-pu-data-clouddatabases]

# Variable set holding the e2e credentials, to create in the CDS project:
#   ovh_application_key / ovh_application_secret / ovh_consumer_key:
#     OVH API token allowed to create/manage/delete managed Kubernetes
#     clusters and database services in the test project
#   project_id: Public Cloud project the e2e suite provisions into
#   docker_registry: registry host/namespace the Docker job pushes to,
#     so the e2e runs the operator image built from the same commit
vars: [pcdb-e2e]

gates:
  manual:
    if: ${{ success() && (git.ref_type == 'tag' || gate.approve) }}
    inputs:
      approve:
        type: boolean
jobs:
  Test:
    runs-on: library/default-vm
    steps:
      - uses: actions/checkout
      - run: make test
      - run: |
          #!/bin/bash
          set -e
          curl -fsSL https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz | tar xz
          curl -fsSL -o venom https://github.com/ovh/venom/releases/download/v1.2.0/venom.linux-amd64
          chmod +x venom
          PATH="$PWD/linux-amd64:$PWD:$PATH" make venom-test-chart

  Docker:
    runs-on: library/default-vm
    steps:
      - uses: actions/checkout
      - run: docker build -t public-cloud-databases-operator .
      - uses: actions/dockerPush
        with:
          image: "public-cloud-databases-operator"
          tags: "${{ git.semver_current }}"

  Helm:
    runs-on: library/default-vm
    steps:
      - uses: actions/checkout
      - uses: actions/helmPush
        with:
          chartFolder: ./deploy/public-cloud-databases-operator
          chartVersion: "${{ git.semver_current }}"

  # Full e2e: provisions a managed Kubernetes cluster and a PostgreSQL
  # service in the test project, checks the ip restriction features, then
  # deletes everything (~30-45 min). Runs on tags only.
  #
  # It runs AFTER Release, not before: the cluster pulls the operator image
  # from an Artifactory Edge, and only released artifacts are distributed
  # there — a snapshot image is unreachable from outside the internal
  # network whatever credentials the cluster holds. The consequence is that
  # this job verifies a release that is already published, so a failure here
  # means superseding that version rather than blocking it.
  E2E:
    runs-on: library/default-vm
    if: ${{ git.ref_type == 'tag' }}
    needs: [Release]
    steps:
      - uses: actions/checkout
      - run: |
          #!/bin/bash
          set -e
          curl -fsSL https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz | tar xz
          curl -fsSL -o venom https://github.com/ovh/venom/releases/download/v1.2.0/venom.linux-amd64
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
          chmod +x venom kubectl
          command -v jq >/dev/null  # the e2e suite decodes the kubeconfig with jq
          # docker_registry is the image repository prefix on the Edge, e.g.
          # rt.ovhcloud.tools/pu-data-clouddatabases-docker-release. The pull
          # secret needs the bare host, so it is split off here.
          REGISTRY_PREFIX="${{ vars.pcdb-e2e.docker_registry }}"
          cat > tests/venom/variables.yaml <<EOF
          ovh:
            endpoint: ovh-eu
            applicationKey: "${{ vars.pcdb-e2e.ovh_application_key }}"
            applicationSecret: "${{ vars.pcdb-e2e.ovh_application_secret }}"
            consumerKey: "${{ vars.pcdb-e2e.ovh_consumer_key }}"
          projectId: "${{ vars.pcdb-e2e.project_id }}"
          suffix: "${{ cds.run_number }}"
          imageRepository: "${REGISTRY_PREFIX}/public-cloud-databases-operator"
          imageTag: "${{ git.semver_current }}"
          registryUser: "${CDS_INTEGRATION_ARTIFACT_MANAGER_TOKEN_NAME}"
          registryPassword: "${CDS_INTEGRATION_ARTIFACT_MANAGER_TOKEN}"
          EOF
          PATH="$PWD/linux-amd64:$PWD:$PATH" make venom-test-e2e

  Release:
    runs-on: library/default-container
    needs: [Test, Docker, Helm]
    gate: manual
    steps:
      - uses: actions/artifactoryRelease
        with:
          artifacts: "docker:**/* helm:*"
